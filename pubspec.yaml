name: p2p_vois
description: "Vois — offline peer-to-peer voice: phone-to-phone walkie-talkie over WiFi Direct and Bluetooth, with multi-phone relay, SOS alerts and encrypted payloads. No internet, no carrier, no accounts."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_sound: ^9.30.0
  permission_handler: ^13.0.1
  package_info_plus: ^10.2.1
  encrypt: ^5.0.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
